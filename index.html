<body>

<div class="container">

```
<h1>Custom Image Generator for Teachers</h1>

<div class="form-group">
    <label for="grade">1. Select Grade</label>
    <select id="grade" onchange="updateImage()">
        <option value="Kindergarten">Kindergarten</option>
        <option value="1st Grade">1st Grade</option>
        <option value="2nd Grade">2nd Grade</option>
        <option value="3rd Grade">3rd Grade</option>
    </select>
</div>

<div class="form-group">
    <label for="studentName">2. Select Student Name</label>
    <select id="studentName" onchange="updateImage()">
        <option value="Alex Smith">Alex Smith</option>
        <option value="Emma Jones">Emma Jones</option>
        <option value="Liam Garcia">Liam Garcia</option>
    </select>
</div>

<div class="form-group">
    <label for="category">3. Select Category</label>
    <select id="category" onchange="updateImage()">
        <option value="Math Superstar">Math Superstar</option>
        <option value="Amazing Reader">Amazing Reader</option>
        <option value="Kindness Award">Kindness Award</option>
    </select>
</div>

<div class="form-group">
    <label for="customText">4. Event Description (1-2 sentences)</label>
    <textarea
        id="customText"
        placeholder="Write something special about the event..."
        oninput="updateImage()"
    ></textarea>
</div>

<div class="preview-box">
    <label>Live Preview:</label>

    <canvas id="imageCanvas" width="800" height="800"></canvas>

    <div id="imageStatus">
        Loading background image...
    </div>
</div>

<button onclick="downloadImage()">
    Download Personalized Image
</button>
```

</div>

<script>

    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const imageStatus = document.getElementById('imageStatus');

    /*
     * IMPORTANT:
     *
     * Put "Good to Great Background Square.png"
     * in the SAME FOLDER as this HTML file.
     *
     * Example:
     *
     * 📁 Teacher Image Generator
     *    ├── teacher-generator.html
     *    └── Good to Great Background Square.png
     */

    const backgroundImage = new Image();

    backgroundImage.onload = function () {
        imageStatus.textContent = "Background image loaded.";
        updateImage();
    };

    backgroundImage.onerror = function () {
        imageStatus.textContent =
            "ERROR: Background image could not be found. Make sure the PNG is in the same folder as this HTML file.";
        console.error(
            "Could not load: Good to Great Background Square.png"
        );
    };

    backgroundImage.src = "Good to Great Background Square.png";


    function updateImage() {

        // Don't try to draw the image before it has loaded
        if (!backgroundImage.complete || backgroundImage.naturalWidth === 0) {
            return;
        }

        // Clear canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw background
        ctx.drawImage(
            backgroundImage,
            0,
            0,
            canvas.width,
            canvas.height
        );

        // Center all text
        ctx.textAlign = "center";

        // Grade
        ctx.font = "bold 24px Arial";
        ctx.fillStyle = "#222222";

        ctx.fillText(
            document.getElementById("grade").value,
            400,
            120
        );


        // Student Name
        ctx.font = "bold 40px Georgia";
        ctx.fillStyle = "#1a73e8";

        ctx.fillText(
            document.getElementById("studentName").value,
            400,
            220
        );


        // Category
        ctx.font = "italic bold 32px Arial";
        ctx.fillStyle = "#da1b60";

        ctx.fillText(
            document.getElementById("category").value,
            400,
            320
        );


        // Description
        ctx.font = "20px Arial";
        ctx.fillStyle = "#444444";

        const text =
            document.getElementById("customText").value;

        wrapText(
            ctx,
            text,
            400,
            420,
            600,
            28
        );
    }


    function wrapText(context, text, x, y, maxWidth, lineHeight) {

        const words = text.split(" ");
        let line = "";

        for (let n = 0; n < words.length; n++) {

            const testLine =
                line + words[n] + " ";

            const metrics =
                context.measureText(testLine);

            if (
                metrics.width > maxWidth &&
                n > 0
            ) {

                context.fillText(
                    line,
                    x,
                    y
                );

                line =
                    words[n] + " ";

                y += lineHeight;

            } else {

                line = testLine;
            }
        }

        context.fillText(
            line,
            x,
            y
        );
    }


    function downloadImage() {

        const link =
            document.createElement("a");

        link.download =
            "Good-to-Great-Student-Award.png";

        link.href =
            canvas.toDataURL("image/png");

        link.click();
    }

</script>

</body>
</html>
